[project]
name = "revenue-recovery-api"
version = "0.1.0"
description = "AI Revenue Recovery Agent — FastAPI backend, agents, RAG and evaluation"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.140",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "redis>=5.2",
    "groq>=0.30",
    "langgraph>=1.0",
    "langfuse>=3.0",
    "fastembed>=0.5",
    "numpy>=1.26",
    "pypdf>=5.0",
    "python-multipart>=0.0.12",
    "faker>=30.0",
    "mcp>=1.2",
    "httpx>=0.27",
    "email-validator>=2.2",
]

[project.optional-dependencies]
eval = [
    "ragas>=0.4",
    "openai>=1.50",
    "langchain-openai>=0.3",
    # ragas 0.4.3 imports chat_models.vertexai, removed in langchain-community 0.4.2
    "langchain-community>=0.4,<0.4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pgserver>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: needs PostgreSQL",
    "live_llm: calls the real Groq API (skipped without GROQ_API_KEY)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["B008", "E501"]  # line length is owned by `ruff format`
