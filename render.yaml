# Render Blueprint for the API (FastAPI + LangGraph agent).
# Render dashboard -> New -> Blueprint -> pick this repository. The web app goes on Vercel (see docs/deploy.md).
services:
  - type: web
    name: revenue-recovery-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # Free: no card needed. Sleeps after 15 min idle (first request then takes ~1 min) and has 512 MB RAM.
    # Switch to "starter" (~$7/month) for an always-on demo, or if the service restarts for memory.
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Neon / Supabase connection string (direct, not the transaction pooler). Any postgres:// form works.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_SIZE
        value: "5"
      # Keep the local ONNX models' thread pools (and memory) small on the 512 MB instance.
      - key: OMP_NUM_THREADS
        value: "1"
      # Shared secret between the web app's server-side proxy and this API. Copy it into Vercel as API_TOKEN.
      - key: DEMO_API_TOKEN
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_REASONING_EFFORT
        value: low
      - key: LLM_MAX_RETRIES
        value: "4"
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://us.cloud.langfuse.com
      - key: SLACK_WEBHOOK_URL
        sync: false
      # Your Vercel URL, e.g. https://revenue-recovery.vercel.app (used for links in Slack messages).
      - key: APP_PUBLIC_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
